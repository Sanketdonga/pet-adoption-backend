openapi: 3.0.0
info:
  title: Pet Adoption API
  description: API for Pet Adoption Management System
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local Server
  - url: https://pet-adoption-backend-vp5x.onrender.com
    description: Production Server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, admin]
    Pet:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
        breed:
          type: string
        age:
          type: number
        gender:
          type: string
        description:
          type: string
        images:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [Available, Pending, Adopted]
    Application:
      type: object
      properties:
        id:
          type: string
        user:
          $ref: '#/components/schemas/User'
        pet:
          $ref: '#/components/schemas/Pet'
        status:
          type: string
          enum: [Pending, Approved, Rejected]
        message:
          type: string
    Error:
      type: object
      properties:
        success:
          type: boolean
          default: false
        message:
          type: string
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        '201':
          description: User registered
        '400':
          description: Bad request
  /api/auth/login:
    post:
      summary: Login user
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
  /api/auth/logout:
    get:
      summary: Logout user
      tags: [Auth]
      responses:
        '200':
          description: Logout successful
  /api/auth/me:
    get:
      summary: Get current user
      tags: [Auth]
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/User' }
  /api/pets:
    get:
      summary: Get all pets
      tags: [Pets]
      security: []
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: species
          schema: { type: string }
      responses:
        '200':
          description: List of pets
    post:
      summary: Create a pet (Admin only)
      tags: [Pets]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, species, breed, age, gender, description]
              properties:
                name: { type: string }
                species: { type: string }
                breed: { type: string }
                age: { type: number }
                gender: { type: string }
                description: { type: string }
                images: 
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Pet created
  /api/pets/{id}:
    get:
      summary: Get single pet
      tags: [Pets]
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pet details
    put:
      summary: Update pet (Admin only)
      tags: [Pets]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                status: { type: string }
                existingImages: { type: array, items: { type: string } }
                images: 
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Pet updated
    delete:
      summary: Delete pet (Admin only)
      tags: [Pets]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pet deleted
  /api/applications:
    post:
      summary: Apply for adoption
      tags: [Applications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [petId, message]
              properties:
                petId: { type: string }
                message: { type: string }
      responses:
        '201':
          description: Application submitted
    get:
      summary: Get all applications (Admin only)
      tags: [Applications]
      responses:
        '200':
          description: List of applications
  /api/applications/my:
    get:
      summary: Get my applications
      tags: [Applications]
      responses:
        '200':
          description: List of user's applications
  /api/applications/{id}:
    put:
      summary: Update application status (Admin only)
      tags: [Applications]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: 
                  type: string
                  enum: [Approved, Rejected]
      responses:
        '200':
          description: Status updated
